# Local full-stack run:  cd Deployment && cp .env.example .env && docker compose up --build
# Web http://localhost:5000   API http://localhost:5001/swagger   ML http://localhost:8000/health
# Requires a trained model at ML/models/zero_day_bundle.joblib (python train_model.py ...).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ml:
    build: ../ML
    environment:
      PORT: "8000"
      ML_API_KEY: ${ML_API_KEY}
      MODEL_PATH: /app/models/zero_day_bundle.joblib
    volumes: ["../ML/models:/app/models:ro"]
    ports: ["8000:8000"]

  api:
    build: ../Backend/ZeroDay.Api
    depends_on:
      sqlserver: { condition: service_healthy }
      ml: { condition: service_started }
    environment:
      PORT: "8080"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=ZeroDayDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY}
      Ml__BaseUrl: http://ml:8000
      Ml__ApiKey: ${ML_API_KEY}
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Upload__Path: /data/uploads
      Database__AutoCreate: "true"
      Auth__ReturnResetToken: "true"   # local dev only: shows the reset token on screen. NEVER in production.
    volumes: [uploads:/data/uploads]
    ports: ["5001:8080"]

  web:
    build: ../Frontend/ZeroDay.Web
    depends_on: [api]
    environment:
      PORT: "8080"
      Api__BaseUrl: http://api:8080
    ports: ["5000:8080"]

volumes:
  sqldata:
  uploads:
